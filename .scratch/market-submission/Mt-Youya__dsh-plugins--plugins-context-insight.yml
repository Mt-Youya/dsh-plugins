name: Mt-Youya/dsh-plugins#sessions-insight
category: usage
description:
  en: "Read-only context panel for DeepSeek Harness: parses existing Claude Code, DSH and Codex session logs and breaks down what each turn actually fed the model — system prompt, tool definitions, memory and instructions, history, tool results and images — marking every count as exact usage or a derived estimate."
  zh: "DeepSeek Harness 的只读上下文面板：解析既有的 Claude Code / DSH / Codex 会话日志，拆开每一轮实际送入模型的上下文——系统提示、工具定义、记忆与指令、历史、工具结果、图片——并标注每个数字是精确 usage 还是折算估算。"
