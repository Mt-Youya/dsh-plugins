# 一键发布到 npm。
#
# 认证走 npm Trusted Publishing（GitHub OIDC）：本 workflow 只在
# npm 包的 Trusted Publisher 里绑定之后才会被 registry 接受，
# 仓库里不存任何 npm token，也不需要 2FA 交互。
name: release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ADR 0010：两个包共用一个发布版本。版本对不上时宁可失败，也不发对不上的包。
      - name: Assert both packages share one version
        run: |
          member="$(node -p "require('./plugins/sessions-insight/package.json').version")"
          collection="$(node -p "require('./package.json').version")"
          if [ "$member" != "$collection" ]; then
            echo "::error::版本不一致：@cyrusdoyle/dsh-sessions-insight=$member，@cyrusdoyle/dsh-plugins=$collection；按 ADR 0010 两个包必须以同一版本成对发布"
            exit 1
          fi
          echo "shared version: $collection"

      - name: Gates
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.client.json
          npx vitest run
          # 集合包把插件源码内联进自己的 lib/，CSS 必须先于 tsdown 生成，否则产物带着旧样式。
          node scripts/build-css.mjs plugins/sessions-insight
          npx tsdown --minify
          node scripts/check-bundle.mjs plugins/sessions-insight
          node scripts/check-bundle.mjs .

      # 诊断 OIDC：npm trusted publishing 需要 npm ≥ 11.5.1，且 id-token: write
      # 生效后 ACTIONS_ID_TOKEN_REQUEST_URL 才会存在。缺任意一项 npm 会直接
      # 报 ENEEDAUTH，看不出到底差在哪一步。
      - name: Debug trusted publishing
        run: |
          echo "npm: $(npm --version)"
          echo "node: $(node --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "OIDC env: present"; else echo "OIDC env: MISSING"; fi

      # 幂等：重跑时若某个版本已经在 registry 上，就跳过它的发布步骤，
      # 避免「成员包发成功、集合包的 trusted publisher 还没配好」这种半途失败
      # 卡住整个流程。
      - name: Check published versions
        id: published
        run: |
          member="$(node -p "require('./plugins/sessions-insight/package.json').version")"
          collection="$(node -p "require('./package.json').version")"
          member_hit="$(npm view "@cyrusdoyle/dsh-sessions-insight@$member" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
          collection_hit="$(npm view "@cyrusdoyle/dsh-plugins@$collection" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
          echo "member_hit=$member_hit" >> "$GITHUB_OUTPUT"
          echo "collection_hit=$collection_hit" >> "$GITHUB_OUTPUT"
          echo "member $member already published: ${member_hit:-no}"
          echo "collection $collection already published: ${collection_hit:-no}"

      # 成员包先 pnpm pack 出 tarball 再发 tarball：pnpm 会改写 workspace 协议，
      # npm 直接读目录发布时不会。prepack 还会重新构建并校验加载契约。
      - name: Pack member
        working-directory: plugins/sessions-insight
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release/member"
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-release/member"

      - name: Publish member
        if: steps.published.outputs.member_hit == ''
        run: npm publish "$RUNNER_TEMP"/npm-release/member/*.tgz --registry=https://registry.npmjs.org/ --loglevel=verbose

      # 集合包的 dependencies 写的是 workspace:^，npm 不认 workspace 协议，
      # 先用 pnpm pack 让 pnpm 把它改写成 ^<member version>，再发 tarball。
      - name: Pack collection
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release/collection"
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-release/collection"

      - name: Publish collection
        if: steps.published.outputs.collection_hit == ''
        run: npm publish "$RUNNER_TEMP"/npm-release/collection/*.tgz --registry=https://registry.npmjs.org/ --loglevel=verbose
